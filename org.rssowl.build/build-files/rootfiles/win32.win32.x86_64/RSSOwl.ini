-startup
plugins/org.eclipse.equinox.launcher_1.0.101.R34x_v20081125.jar
--launcher.library
plugins/org.eclipse.equinox.launcher.win32.win32.x86_64_1.0.101.R34x_v20080731
-vm
jre/bin/javaw.exe
-vmargs
-Xms64m
-Xmx512m
